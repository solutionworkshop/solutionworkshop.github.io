<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark"><head><script src="assets/theme.js"></script>
<script>/* This mock always opens dark; the button below switches it for this visit only. */document.documentElement.dataset.theme=document.documentElement.dataset.bsTheme='dark';</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>HQ Board dark search · Mockup 12</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="24x24" href="assets/favicon-24x24.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="mock.css">
<style>
.board-search .form-control{background:var(--sw-raised)}
.btn-check+.btn{border-color:var(--sw-line);color:var(--sw-ink);background:var(--sw-surface)}
.btn-check:checked+.btn{background:var(--sw-accent);border-color:var(--sw-accent);color:var(--sw-button-ink)}
.issue-no{font:600 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sw-muted)}
</style>
</head><body>
<div class="mock-banner"><span>Mockup 12 · Dark mode with data-bs-theme · Not wired up · Fictional data</span><a href="./">All search mockups</a></div>
<main class="mock-page">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
    <div><p class="text-uppercase small fw-semibold mb-1" style="color:var(--sw-link)">HQ Board</p><h1 class="mock-title">Company board</h1></div>
    <button class="btn btn-outline-secondary" type="button" id="themeBtn" aria-pressed="true">Switch to light</button>
  </div>
  <form class="board-search mb-3" role="search" onsubmit="event.preventDefault()">
    <label class="form-label fw-semibold" for="bq">Search the board</label>
    <input class="form-control form-control-lg" id="bq" type="search" value="calendar" placeholder="Search titles, owners or issue numbers" autocomplete="off">
  </form>
  <div class="btn-group flex-wrap mb-3" role="group" aria-label="Show">
    <input type="radio" class="btn-check" name="kind" id="k0" value="" checked><label class="btn" for="k0">Everything</label>
    <input type="radio" class="btn-check" name="kind" id="k1" value="Waiting for review"><label class="btn" for="k1">Waiting for review</label>
    <input type="radio" class="btn-check" name="kind" id="k2" value="Decision"><label class="btn" for="k2">Decisions</label>
    <input type="radio" class="btn-check" name="kind" id="k3" value="Blocked"><label class="btn" for="k3">Blocked</label>
  </div>
  <div class="table-responsive border rounded-3" style="border-color:var(--sw-line)!important">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th scope="col">Item</th><th scope="col" class="d-none d-sm-table-cell">Owner</th><th scope="col">State</th></tr></thead>
      <tbody id="brows"></tbody>
    </table>
  </div>
  <aside class="mock-who mt-4"><strong>Who searches here:</strong> The team at a board review, pulling up every item about one topic (“calendar”, “SMS”) or one issue number, often on a dimmed screen in the evening.</aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
const items = [
  ['#9001','Calendar connect: owner sees busy times','Ava','Waiting for review','info'],
  ['#9002','Decide calendar reminder wording','Ben','Decision','warn'],
  ['#9003','Calendar sync shows stale event','Cy','Blocked','danger'],
  ['#9004','SMS opt-in copy for lawn care','Ava','Waiting for review','info'],
  ['#9005','Invoice draft from accepted bid','Dee','Waiting for review','info'],
  ['#9006','Pick a search motif for HQ','Ben','Decision','warn']
];
const bq = document.getElementById('bq');
function render() {
  const v = bq.value, kind = document.querySelector('[name=kind]:checked').value;
  const hits = items.filter(r => (!kind || r[3] === kind) && SearchMock.matches([r[0], r[1], r[2]], v));
  document.getElementById('brows').innerHTML = hits.map(r => `<tr><td><span class="issue-no">${SearchMock.mark(r[0], v)}</span> <a href="#" style="color:var(--sw-link)">${SearchMock.mark(r[1], v)}</a><span class="mock-meta d-sm-none">${r[2]}</span></td><td class="d-none d-sm-table-cell">${SearchMock.mark(r[2], v)}</td><td><span class="mock-status ${r[4]}">${r[3]}</span></td></tr>`).join('') || '<tr><td colspan="3" class="mock-empty">Nothing on the board matches.</td></tr>';
}
bq.addEventListener('input', render);
document.querySelectorAll('[name=kind]').forEach(r => r.addEventListener('change', render));
document.getElementById('themeBtn').addEventListener('click', e => {
  const root = document.documentElement, dark = root.dataset.bsTheme === 'dark';
  root.dataset.bsTheme = root.dataset.theme = dark ? 'light' : 'dark';
  e.target.textContent = dark ? 'Switch to dark' : 'Switch to light';
  e.target.setAttribute('aria-pressed', String(!dark));
});
render();
</script>
</body></html>
